/* ═══════════════════════════════════════════════════════════════
   6. CHARTS
   The deck idiom: label the data, drop the axis furniture, keep one
   baseline. Inline SVG, no libraries.
   ═══════════════════════════════════════════════════════════════ */
/* chart figures ride the same sans as the rest of the deck */
const MONO_SVG = "Segoe UI,Segoe UI Variable Text,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif";
let gradSeq = 0;
const gradId = () => `g${++gradSeq}`;

/* ── charts are drawn at the size they are displayed ───────────
   Every chart used to be a fixed viewBox at width:100%, which meant its type
   size was whatever the container made it: the coverage basket, the segment
   bars and the scatter rendered their labels at 4.7–6.4px on a phone, and the
   side-panel chart ran to 20px on a tablet. A font-size attribute inside a
   scaled viewBox is not a size, it is a ratio.

   So a chart is no longer built during render(). It reserves a slot, and once
   the column is in the document and has a real width, the slot measures itself
   and asks for an SVG drawn at exactly that width — viewBox width equals CSS
   width, scale is 1, and a font-size of 9.5 is 9.5px on screen at every
   viewport. Drawing at true size then makes crowding real rather than
   invisible, which is why the chart functions below thin their own labels
   instead of shrinking them. */
let chartSlots = [], chartSeq = 0;
function chartSlot(draw){
  const id = `cslot${++chartSeq}`;
  chartSlots.push({id, draw});
  return `<div class="cslot" id="${id}"></div>`;
}
function paintCharts(){
  chartSlots.forEach(sl => {
    const host = document.getElementById(sl.id);
    if(!host) return;
    const w = Math.round(host.getBoundingClientRect().width);
    if(w < 1 || host.dataset.w === String(w)) return;  /* nothing has moved */
    host.dataset.w = String(w);
    host.innerHTML = sl.draw(w);
  });
}
/* a resize changes the width without changing the state, so the charts are
   repainted on their own rather than through a full render() */
let paintTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(paintTimer);
  paintTimer = setTimeout(paintCharts, 120);
});

function spark(vals, color, tip, {w = 78, h = 24} = {}){
  const iw = w - 3;
  const d = vals.length < 2 ? [vals[0], vals[0]] : vals;
  const mn = Math.min(...d), mx = Math.max(...d), sp = (mx - mn) || 1;
  const pt = d.map((v, i) => [i / (d.length - 1) * iw, h - 3 - ((v - mn) / sp) * (h - 6)]);
  const line = pt.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
  const [lx, ly] = pt.at(-1);
  return `<svg width="${w}" height="${h}" role="img" aria-label="${esc(tip || "price history")}">
      ${tip ? `<title>${esc(tip)}</title>` : ""}
      <path d="${line} L${iw} ${h} L0 ${h} Z" fill="${color}" opacity=".13"/>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="1.7" stroke-linejoin="round"/>
      <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2" fill="${color}"/>
    </svg>`;
}

/* area chart with a dashed mean reference */
function areaChart(rows, xk, yk, label, w){
  const W = Math.max(260, Math.round(w || 680)), H = 210, T = 30, B = 30;
  const L = 18, R = clamp(W * 0.1, 44, 66);
  const iw = W - L - R, ih = H - T - B, id = gradId();
  /* Drawn at true size, so crowding is real. Where the points sit closer than
     a label is wide the labels thin out rather than shrink — a 6px figure is
     not a smaller label, it is an unreadable one. */
  const gap = rows.length > 1 ? iw / (rows.length - 1) : iw;
  const allVals = gap >= 40, xEvery = gap < 30 ? 2 : 1;
  const vals = rows.map(r => r[yk]);
  const max = niceMax(Math.max(...vals));
  const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
  const xs = i => L + (rows.length < 2 ? iw / 2 : (i / (rows.length - 1)) * iw);
  const ys = v => T + ih - (v / max) * ih;
  const line = rows.map((r, j) => `${j ? "L" : "M"}${xs(j).toFixed(1)} ${ys(r[yk]).toFixed(1)}`).join(" ");
  const area = `${line} L${xs(rows.length - 1).toFixed(1)} ${ys(0).toFixed(1)} L${xs(0).toFixed(1)} ${ys(0).toFixed(1)} Z`;
  const last = rows.length - 1;
  const marks = rows.map((r, j) => {
    const x = xs(j).toFixed(1), y = ys(r[yk]);
    const showV = allVals || j === 0 || j === last;
    const showX = j % xEvery === 0 || j === last;
    return `<circle cx="${x}" cy="${y.toFixed(1)}" r="4" fill="${C.marker}" stroke="${C.line}" stroke-width="2"/>
      ${showV ? `<text x="${x}" y="${(y - 13).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700"
            fill="${C.label}">${r[yk]}</text>` : ""}
      ${showX ? `<text x="${x}" y="${H - 9}" text-anchor="middle" font-size="11.5" fill="${C.axis}">${esc(r[xk])}</text>` : ""}`;
  }).join("");

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label || "")}">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${C.line}" stop-opacity=".24"/>
        <stop offset="100%" stop-color="${C.line}" stop-opacity=".01"/></linearGradient></defs>
      <path d="${area}" fill="url(#${id})"/>
      <line x1="${L}" y1="${ys(0).toFixed(1)}" x2="${W - R + 8}" y2="${ys(0).toFixed(1)}"
            stroke="${C.rule}" stroke-width="1"/>
      <line x1="${L}" y1="${ys(mean).toFixed(1)}" x2="${W - R + 8}" y2="${ys(mean).toFixed(1)}"
            stroke="${C.axis}" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="${W - 6}" y="${(ys(mean) + 3.5).toFixed(1)}" text-anchor="end" font-size="9.5"
            letter-spacing="1" fill="${C.axis}">${R < 60 ? "" : "MEAN "}${mean.toFixed(1)}</text>
      <path d="${line}" fill="none" stroke="${C.line}" stroke-width="2.4" stroke-linejoin="round"/>
      ${marks}</svg>`;
}

/* bar chart – leader picked out, direct labels, baseline only */
/* `nk` is an optional key holding how many things each bar is averaging. Six
   segment returns read very differently once you can see that one of them is
   four names and another is five, and the bar chart is the only place that
   fact fits. `act` makes the bars a way into the filter. */
function barChart(rows, xk, yk, label = "Reports published by desk", nk, act, w){
  const W = Math.max(260, Math.round(w || 680)), H = 210, L = 16, R = 16, T = 30;
  const iw = W - L - R;
  const vals = rows.map(r => r[yk]);
  const max = niceMax(Math.max(...vals));
  const step = iw / rows.length, bw = Math.min(24, step * 0.52);

  /* At true size a label has to fit the step it sits under, and "Car carriers"
     does not fit a 50px column at 11px. A two-word name breaks over two lines
     first, because that keeps the type at full size; only then does the size
     come down, and never below 8.5px — under that it stops being a label. */
  const PER = 0.55;                       /* width per character per px of type */
  const fitLabel = t => {
    let lines = [String(t)];
    if(lines[0].length * PER * 11 > step - 4 && lines[0].includes(" ")){
      const i = lines[0].lastIndexOf(" ");
      lines = [lines[0].slice(0, i), lines[0].slice(i + 1)];
    }
    const longest = Math.max(...lines.map(l => l.length));
    return {lines, fs: clamp((step - 4) / (longest * PER), 8.5, 11)};
  };
  const fits = rows.map(r => fitLabel(r[xk]));
  const maxLines = Math.max(...fits.map(f => f.lines.length));
  /* the frame gives back exactly the room the labels turned out to need */
  const LINE = 13;
  const B = 22 + maxLines * LINE + (nk ? 11 : 0);
  /* "4 NAMES" is 43px with its letter-spacing and does not fit a 46px column,
     so where the step is tight the count says the same thing in a third of the
     room. It is never the only thing identifying the bar — the segment name is
     directly above it. */
  const cntTxt = n => (step - 4) >= 50 ? `${n} NAME${n === 1 ? "" : "S"}` : `n=${n}`;
  const ih = H - T - B;
  const bars = rows.map((r, j) => {
    const bh = Math.max(2, (r[yk] / max) * ih);
    const x = L + step * j + (step - bw) / 2, by = T + ih - bh;
    /* the hue belongs to the desk, so re-sorting or filtering never
       repaints the survivors – it used to mark whichever bar was tallest */
    const fill = C.cats[j % C.cats.length];
    /* rounded cap, square where it meets the baseline */
    const cr = Math.min(4, bh / 2, bw / 2);
    const cap = `M${x.toFixed(1)} ${(by + bh).toFixed(1)} L${x.toFixed(1)} ${(by + cr).toFixed(1)}`
      + ` Q${x.toFixed(1)} ${by.toFixed(1)} ${(x + cr).toFixed(1)} ${by.toFixed(1)}`
      + ` L${(x + bw - cr).toFixed(1)} ${by.toFixed(1)}`
      + ` Q${(x + bw).toFixed(1)} ${by.toFixed(1)} ${(x + bw).toFixed(1)} ${(by + cr).toFixed(1)}`
      + ` L${(x + bw).toFixed(1)} ${(by + bh).toFixed(1)} Z`;
    const mid = (x + bw / 2).toFixed(1);
    const g = act && r.k
      ? `<g class="barhit" data-act="${act}" data-v="${esc(r.k)}"><title>${esc(r[xk])}: filter the basket to this segment</title>`
      : "<g>";
    const f = fits[j];
    const labelTop = H - B + 14;
    return `${g}<path d="${cap}" fill="${fill}"/>
      <text x="${mid}" y="${(by - 9).toFixed(1)}" text-anchor="middle" font-size="13"
            font-weight="700" fill="${C.label}">${r[yk]}</text>
      ${f.lines.map((ln, k) => `<text x="${mid}" y="${(labelTop + k * LINE).toFixed(1)}" text-anchor="middle"
            font-size="${f.fs.toFixed(1)}" fill="${C.axis}">${esc(ln)}</text>`).join("")}
      ${nk ? `<text x="${mid}" y="${(labelTop + maxLines * LINE + 1).toFixed(1)}" text-anchor="middle"
            font-size="8.5" letter-spacing="${(step - 4) >= 50 ? ".9" : "0"}" fill="${C.axis}">${cntTxt(r[nk])}</text>` : ""}
      ${act && r.k ? `<rect x="${(L + step * j).toFixed(1)}" y="${T}" width="${step.toFixed(1)}"
            height="${ih.toFixed(1)}" fill="transparent"/>` : ""}
      </g>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
      ${bars}
      <line x1="${L}" y1="${T + ih}" x2="${W - R}" y2="${T + ih}" stroke="${C.rule}" stroke-width="1"/>
    </svg>`;
}

/* A chart opts into the hover readout by carrying data-pts and one of these
   layers. Both hooks used to be ids — #pricechart and #ph — which is exactly
   why the coverage basket and the side-panel chart had no readout: two ids
   cannot coexist in one document, so only the market's price chart could ever
   have one. They are classes now, and the geometry travels with the chart, so
   the handler reads the frame it is actually drawn in. */
function crosshairLayer(T, ih, col, col2){
  return `<g class="ph" opacity="0" pointer-events="none">
      <line class="ph-line" y1="${T}" y2="${(T + ih).toFixed(1)}" stroke="${C.axis}" stroke-width="1" stroke-dasharray="3 3"/>
      ${col2 ? `<circle class="ph-dot2" r="3.4" fill="${col2}" stroke="${C.marker}" stroke-width="1.6"/>` : ""}
      <circle class="ph-dot" r="4" fill="${col}" stroke="${C.marker}" stroke-width="1.6"/>
      <rect class="ph-box" y="${T - 4}" height="16" rx="3" fill="${C.label}" opacity=".92"/>
      <text class="ph-lab" y="${T + 7.5}" text-anchor="middle" font-size="9.5" font-weight="700"
            font-family="${MONO_SVG}" fill="${C.marker}"></text>
    </g>`;
}
/* the payload rides in a single-quoted attribute, so the quote and the two
   characters that could end the attribute or open a tag are escaped */
const attrJSON = o => JSON.stringify(o)
  .replace(/&/g, "&amp;").replace(/'/g, "&#39;").replace(/</g, "&lt;");

/* Does a line segment cross an axis-aligned box? Used to keep a chart's
   figures off the lines they describe. Cheap enough to run per candidate
   position: four corner crossings plus the two containment cases. */
function segHitsBox(p, q, r){
  const inside = t => t[0] >= r.x1 && t[0] <= r.x2 && t[1] >= r.y1 && t[1] <= r.y2;
  if(inside(p) || inside(q)) return true;
  const ccw = (a, b, c) => (c[1] - a[1]) * (b[0] - a[0]) > (b[1] - a[1]) * (c[0] - a[0]);
  const cross = (a, b, c, d) => ccw(a, c, d) !== ccw(b, c, d) && ccw(a, b, c) !== ccw(a, b, d);
  const k = [[r.x1, r.y1], [r.x2, r.y1], [r.x2, r.y2], [r.x1, r.y2]];
  for(let i = 0; i < 4; i++) if(cross(p, q, k[i], k[(i + 1) % 4])) return true;
  return false;
}
const boxHitsBox = (a, b) => a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1;
/* getBBox on a <text> returns the em box, not the ink: measured across this
   deck's face it runs 0.96x the font size above the baseline and 0.24x below.
   Placement uses the same box the checks measure, so the two cannot disagree. */
const textBox = (x, y, w, px, anchor = "middle") => ({
  x1: anchor === "end" ? x - w : anchor === "start" ? x : x - w / 2,
  x2: anchor === "end" ? x : anchor === "start" ? x + w : x + w / 2,
  y1: y - px * 0.96, y2: y + px * 0.24
});

/* index chart – a rebased series lives in a narrow band around its base,
   so areaChart's zero baseline would spend the whole frame on empty air.
   This one pads the observed range instead and keeps the rebase line as
   the single reference, which is the level a reader actually compares to. */
function indexChart(rows, xk, yk, base, label, box, ov){
  /* the side panel is half the width of a full panel, so a shared viewBox
     would render this type at half the size. The geometry travels with the
     caller instead, and the labels stay the same on screen either way. */
  const {W, H, L, R, T, B} = box || {W:680, H:210, L:18, R:76, T:30, B:30};
  const iw = W - L - R, ih = H - T - B, id = gradId();
  /* the same thinning rule the area chart uses: at true size the labels crowd
     for real, so they drop out rather than shrink */
  const gap = rows.length > 1 ? iw / (rows.length - 1) : iw;
  const allVals = gap >= 40, xEvery = gap < 30 ? 2 : 1, lastIdx = rows.length - 1;
  /* an optional second series on the same rebase — the selected name against
     the basket it belongs to. It has to share the scale, so its values go
     into the range before the padding is worked out, not after. */
  const ovr = ov && ov.rows && ov.rows.length === rows.length ? ov : null;
  const vals = rows.map(r => r[yk])
    .concat(base == null ? [] : [base])
    .concat(ovr ? ovr.rows.map(r => r[yk]) : []);
  const lo0 = Math.min(...vals), hi0 = Math.max(...vals);
  const pad = Math.max((hi0 - lo0) * 0.22, 0.5);
  const lo = lo0 - pad, hi = hi0 + pad;
  const xs = i => L + (rows.length < 2 ? iw / 2 : (i / (rows.length - 1)) * iw);
  const ys = v => T + ih - ((v - lo) / (hi - lo)) * ih;
  /* measured against the rebase where there is one, otherwise against where
     the window opened – either way the whole window, not the last tick, so
     the fill does not flip on a single down week */
  const col = rows.at(-1)[yk] >= (base == null ? rows[0][yk] : base) ? C.pos : C.neg;
  const dp = Math.abs(hi0) >= 1000 ? 0 : 1;
  const pt = rows.map((r, j) => [xs(j), ys(r[yk])]);
  const opt = ovr ? ovr.rows.map((r, j) => [xs(j), ys(r[yk])]) : null;
  const line = pt.map(([x, y], j) => `${j ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)}`).join(" ");
  const area = `${line} L${xs(lastIdx).toFixed(1)} ${(T + ih).toFixed(1)}`
    + ` L${xs(0).toFixed(1)} ${(T + ih).toFixed(1)} Z`;

  /* The rebase rule stops short of its own caption rather than running under
     it. The caption is measured, not assumed: at the widest right margin
     "REBASE 100" is wider than the margin itself, so a fixed end put the rule
     through the word. */
  const capTxt = base == null ? "" : `${R < 62 ? "" : "REBASE "}${base}`;
  const capW = capTxt ? textWidth(capTxt, 9.5, 400, 1) : 0;
  const baseY = base == null ? 0 : ys(base);
  const ruleX2 = Math.max(L + 12, Math.min(W - R + 8, W - 6 - capW - 6));

  /* Everything a figure must not land on, collected before a single figure is
     placed: both series, the rebase rule, every mark, the x labels, the rebase
     caption and the overlay's ticker. A fixed 13px above the mark was right
     for one line and wrong the moment a second shared the frame — with a name
     overlaid on the basket, 102.9, 102.8, 104.6 and 106.2 all sat on its line,
     and the first figure hung off the left edge of the frame. */
  const segs = [], boxes = [];
  const addSegs = ps => { for(let i = 0; i < ps.length - 1; i++) segs.push([ps[i], ps[i + 1]]); };
  addSegs(pt);
  if(opt) addSegs(opt);
  if(base != null) segs.push([[L, baseY], [ruleX2, baseY]]);
  pt.forEach(([x, y]) => boxes.push({x1:x - 5.5, x2:x + 5.5, y1:y - 5.5, y2:y + 5.5}));
  rows.forEach((r, j) => {
    if(j % xEvery === 0 || j === lastIdx)
      boxes.push(textBox(xs(j), H - 9, textWidth(String(r[xk]), 11.5, 400), 11.5));
  });
  if(capTxt) boxes.push(textBox(W - 6, baseY + 3.5, capW, 9.5, "end"));

  /* Nothing is placed below this: the x labels own the bottom band, and a
     figure that reached it would be read as one of them. */
  const floorY = H - 9 - 11.5 * 0.96 - 1;
  const free = bx => {
    if(bx.x1 < 2 || bx.x2 > W - 2 || bx.y1 < 3 || bx.y2 > floorY) return false;
    /* the lines are stroked, so a box that only just clears the centreline
       still touches the stroke. Two pixels covers the widest of them. */
    const wide = {x1:bx.x1 - 2, x2:bx.x2 + 2, y1:bx.y1 - 2, y2:bx.y2 + 2};
    return !segs.some(([p, q]) => segHitsBox(p, q, wide)) && !boxes.some(b => boxHitsBox(bx, b));
  };

  /* The overlay is the quiet one: a thinner line, no fill and no per-point
     figures, so the basket keeps the reading and the name is the comparison
     rather than a competing series. It carries its ticker at its own end, and
     that ticker is set in the text token, not in the segment hue: the six
     category colours are validated as marks and four of the six go under AA
     the moment they are used as small text. The end dot is the mark and wears
     the hue; the label beside it is the name.

     Where the ticker goes is measured, not assumed. It used to be parked at
     the dot's right shoulder, which is wider than the margin it sits in for
     any ticker longer than about five characters — MAERSK-B measures 61px
     against a 42px margin at 320, and ran off the frame. So it takes the
     shoulder where the shoulder fits, and otherwise sits above the dot,
     right-aligned to the frame, stepping until it is clear of the basket
     line and the REBASE caption. */
  let ovLayer = "";
  if(ovr){
    const oline = opt.map(([x, y], j) => `${j ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)}`).join(" ");
    const [ex, ey] = opt[lastIdx];
    const otw = textWidth(ovr.name, 10.5, 700);
    boxes.push({x1:ex - 4.5, x2:ex + 4.5, y1:ey - 4.5, y2:ey + 4.5});
    const cands = ex + 7 + otw <= W - 3
      ? [{x:ex + 7, a:"start", dy:3.4}, {x:ex + 7, a:"start", dy:-11}, {x:ex + 7, a:"start", dy:16}]
      : [{x:W - 3, a:"end", dy:-12}, {x:W - 3, a:"end", dy:17}, {x:W - 3, a:"end", dy:-25}, {x:W - 3, a:"end", dy:30}];
    let put = null;
    for(const c of cands){
      const y = clamp(ey + c.dy, T + 8, T + ih + 9);
      const bx = textBox(c.x, y, otw, 10.5, c.a);
      if(!free(bx)) continue;
      put = {...c, y, bx}; break;
    }
    /* the second series has to be named, so the last resort is the first
       candidate pulled inside the frame rather than no label at all */
    if(!put){
      const c = cands[0];
      const y = clamp(ey + c.dy, T + 12, floorY - 3);
      const x = c.a === "end" ? clamp(c.x, otw + 3, W - 3) : clamp(c.x, 3, W - 3 - otw);
      put = {...c, x, y, bx:textBox(x, y, otw, 10.5, c.a)};
    }
    boxes.push(put.bx);
    ovLayer = `<path d="${oline}" fill="none" stroke="${ovr.color}" stroke-width="1.8"
        stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="3.2" fill="${ovr.color}"/>
      <text x="${put.x.toFixed(1)}" y="${put.y.toFixed(1)}" text-anchor="${put.a}" font-size="10.5" font-weight="700"
            fill="${C.label}">${esc(ovr.name)}</text>`;
  }

  /* Which side the figures sit on is decided once for the whole series so they
     read as a set: with a second line running above the basket they go below
     it, and the other way round. A figure whose place is taken — by a crossing
     line, the frame, a mark or a figure already down — steps further out on
     the same side before it changes sides, because two depths on one side
     still read as a set and one figure alone on the other does not. It is left
     off only once the frame has genuinely run out of room. Ends first: the two
     figures a reader compares are the ones the window opened and closed at. */
  const ovAbove = opt ? opt.filter(([, y], j) => y < pt[j][1]).length > rows.length / 2 : false;
  const dys = ovAbove ? [18, 31, 44, -13, -26] : [-13, -26, -39, 18, 31];
  const order = [lastIdx, 0].concat(rows.map((r, j) => j).filter(j => j !== 0 && j !== lastIdx));
  const placed = new Array(rows.length).fill(null);
  order.forEach(j => {
    if(!(allVals || j === 0 || j === lastIdx)) return;
    const t = rows[j][yk].toFixed(dp);
    const tw = textWidth(t, 12.5, 700);
    const cx = clamp(pt[j][0], tw / 2 + 3, W - 3 - tw / 2);
    for(const dy of dys){
      const y = pt[j][1] + dy;
      const bx = textBox(cx, y, tw, 12.5);
      if(!free(bx)) continue;
      boxes.push(bx);
      placed[j] = {t, x:cx, y};
      break;
    }
  });

  const marks = rows.map((r, j) => {
    const [px, py] = pt[j];
    const v = placed[j];
    const showX = j % xEvery === 0 || j === lastIdx;
    return `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4" fill="${C.marker}" stroke="${col}" stroke-width="2"/>
      ${v ? `<text x="${v.x.toFixed(1)}" y="${v.y.toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="700"
            fill="${C.label}">${v.t}</text>` : ""}
      ${showX ? `<text x="${px.toFixed(1)}" y="${H - 9}" text-anchor="middle" font-size="11.5" fill="${C.axis}">${esc(r[xk])}</text>` : ""}`;
  }).join("");

  /* The readout names the week and the level, and where a second series shares
     the frame it names both — reading one name against the basket at a given
     week is the whole point of overlaying them. Below about 380px the frame is
     narrower than that sentence, so it drops back to the basket alone. */
  const phPts = rows.map((r, j) => ({
    x:+pt[j][0].toFixed(1), y:+pt[j][1].toFixed(1),
    oy:opt ? +opt[j][1].toFixed(1) : null,
    t:`${r[xk]} · ${r[yk].toFixed(dp)}`
      + (ovr && W >= 380 ? ` · ${ovr.name} ${ovr.rows[j][yk].toFixed(dp)}` : "")
  }));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label || "")}"
       data-pts='${attrJSON(phPts)}'>
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${col}" stop-opacity=".22"/>
        <stop offset="100%" stop-color="${col}" stop-opacity=".01"/></linearGradient></defs>
      <path d="${area}" fill="url(#${id})"/>
      ${base == null ? "" : `
        <line x1="${L}" y1="${baseY.toFixed(1)}" x2="${ruleX2.toFixed(1)}" y2="${baseY.toFixed(1)}"
              stroke="${C.axis}" stroke-width="1" stroke-dasharray="4 4"/>
        <text x="${W - 6}" y="${(baseY + 3.5).toFixed(1)}" text-anchor="end" font-size="9.5"
              letter-spacing="1" fill="${C.axis}">${capTxt}</text>`}
      ${ovLayer}
      <path d="${line}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"/>
      ${marks}
      ${crosshairLayer(T, ih, col, ovr && ovr.color)}</svg>`;
}

/* The index chart in its two homes. Both take their width from the slot that
   measured itself, so the only difference left is the right margin: a full
   panel has room to caption the rebase line, a side panel does not, and below
   about 620px neither does — the caption drops to the bare number and the
   margin comes back as plot. */
const idxGeom = (w, side) => {
  const W = Math.max(240, Math.round(w));
  return side
    ? {W, H:200, L:16, R:16, T:30, B:28}
    : {W, H:210, L:18, R:Math.round(clamp(W * 0.11, 42, 76)), T:30, B:30};
};

/* Real text measurement, memoised.
   The scatter used to estimate a label at 5.75px a character. Measured, the
   tickers run 5.8 to 7.9 — up to 37% wider than the estimate — and the handoff
   listed that estimate as a known gap on the grounds that "every figure in the
   deck uses one face, so the estimate holds". It did not hold; it was hidden,
   because the whole frame was being scaled down to illegibility and two labels
   on top of each other at 4.7px look like texture. Drawing at true size made
   it visible immediately. A canvas context measures the real face at the real
   size, which costs one measurement per distinct string per session. */
let measureCtx = null;
const measureCache = new Map();
function textWidth(t, px, weight = 600, tracking = 0){
  const key = `${weight}|${px}|${tracking}|${t}`;
  const hit = measureCache.get(key);
  if(hit !== undefined) return hit;
  if(!measureCtx) measureCtx = document.createElement("canvas").getContext("2d");
  const fam = getComputedStyle(document.body).fontFamily || "sans-serif";
  measureCtx.font = `${weight} ${px}px ${fam}`;
  const w = measureCtx.measureText(t).width + t.length * tracking;
  measureCache.set(key, w);
  return w;
}

/* Marks for the scatter. Six shapes at roughly equal visual weight, so a
   segment is carried by shape as well as hue. That redundancy is not
   decoration: the palette's two accepted contrast warnings are only legal
   while a category is never shown as colour alone, and a scatter is the
   one place in the deck where there is no label beside the mark. */
function eqMark(shape, cx, cy, r, fill){
  const p = (d) => `<path d="${d}" fill="${fill}"/>`;
  const x = +cx.toFixed(1), y = +cy.toFixed(1);
  switch(shape){
    case "square":  { const h = r * 0.89;
      return `<rect x="${(x - h).toFixed(1)}" y="${(y - h).toFixed(1)}" width="${(h * 2).toFixed(1)}"
                    height="${(h * 2).toFixed(1)}" rx="1.2" fill="${fill}"/>`; }
    case "diamond": { const d = r * 1.26;
      return p(`M${x} ${(y - d).toFixed(1)}L${(x + d).toFixed(1)} ${y}L${x} ${(y + d).toFixed(1)}L${(x - d).toFixed(1)} ${y}Z`); }
    case "up":      { const w = r * 1.17, h = r * 1.35;
      return p(`M${x} ${(y - h).toFixed(1)}L${(x + w).toFixed(1)} ${(y + h * 0.72).toFixed(1)}L${(x - w).toFixed(1)} ${(y + h * 0.72).toFixed(1)}Z`); }
    case "down":    { const w = r * 1.17, h = r * 1.35;
      return p(`M${x} ${(y + h).toFixed(1)}L${(x + w).toFixed(1)} ${(y - h * 0.72).toFixed(1)}L${(x - w).toFixed(1)} ${(y - h * 0.72).toFixed(1)}Z`); }
    case "cross":   { const a = r * 1.25, t = r * 0.42;
      return p(`M${(x - t).toFixed(1)} ${(y - a).toFixed(1)}H${(x + t).toFixed(1)}V${(y - t).toFixed(1)}`
             + `H${(x + a).toFixed(1)}V${(y + t).toFixed(1)}H${(x + t).toFixed(1)}V${(y + a).toFixed(1)}`
             + `H${(x - t).toFixed(1)}V${(y + t).toFixed(1)}H${(x - a).toFixed(1)}V${(y - t).toFixed(1)}`
             + `H${(x - t).toFixed(1)}Z`); }
    default: return `<circle cx="${x}" cy="${y}" r="${r.toFixed(1)}" fill="${fill}"/>`;
  }
}

/* Relative value. P/NAV runs on a log axis because it is a ratio — 0.5x and
   2x are the same distance from parity, and a linear axis would squash
   twenty names into the left third to make room for two terminal operators.
   The parity line is the reference, the way 50c is on the price chart. */
const SC = {H:310, L:34, R:22, T:22, B:46};
function scatterChart(rows, sel, w){
  const {H, L, R, T, B} = SC;
  const W = Math.max(260, Math.round(w || 680));
  const iw = W - L - R, ih = H - T - B;
  if(!rows.length) return "";
  /* Labels used to be forced on: when the placement ran out of room it dropped
     the ticker at its first candidate anyway, which was fine while the whole
     frame was scaled down to illegibility and invisible. Drawn at true size
     that becomes two tickers on top of each other, which is worse than one
     missing. So a label is drawn if a free position exists and left off if it
     does not — the count degrades with the frame instead of the type size.
     Nothing is lost: the mark keeps its shape and hue, the legend keeps the
     segment, and the tooltip and the tap both give the name. The selected
     name is placed first, so the plot always has one anchor a reader can
     name. */
  const xv = rows.map(r => Math.log10(pnav(r))).concat(0);
  const yv = rows.map(r => r.yld);
  const xlo0 = Math.min(...xv), xhi0 = Math.max(...xv);
  const xpad = Math.max((xhi0 - xlo0) * 0.1, 0.03);
  const xlo = xlo0 - xpad, xhi = xhi0 + xpad;
  const ymax = niceMax(Math.max(...yv, 1));
  const xs = v => L + ((Math.log10(v) - xlo) / (xhi - xlo)) * iw;
  const ys = v => T + ih - (v / ymax) * ih;

  const xTicks = (W < 430 ? [0.5, 1, 2] : [0.5, 0.75, 1, 1.5, 2, 3])
    .filter(v => Math.log10(v) >= xlo && Math.log10(v) <= xhi);
  const yTicks = [0, ymax / 2, ymax];

  const grid = yTicks.map(v => `
    <line x1="${L}" y1="${ys(v).toFixed(1)}" x2="${W - R}" y2="${ys(v).toFixed(1)}"
          stroke="${C.rule}" stroke-width="1"${v ? ' stroke-dasharray="3 4"' : ""}/>
    <text x="${L - 7}" y="${(ys(v) + 3.5).toFixed(1)}" text-anchor="end" font-size="9.5"
          fill="${C.axis}">${v % 1 ? v.toFixed(1) : v.toFixed(0)}</text>`).join("")
    + xTicks.map(v => `
    <text x="${xs(v).toFixed(1)}" y="${H - 22}" text-anchor="middle" font-size="9.5"
          fill="${C.axis}">${v}×</text>`).join("");

  /* Labels. Twenty-three tickers in one frame will collide, and an
     unreadable label is worse than none — but dropping labels means a point
     nobody can identify, which is worse still. So every point keeps its
     label and the placement does the work: right of the mark, else left,
     else above or below, else nudged clear. Marks go into the same
     collision set as the labels, so a label never lands on a point.
     Widths are estimated from the character count; the face is the same
     one every figure in the deck uses, so the estimate holds. */
  const LH = 11.5;
  const lw = t => textWidth(t, 9.5, 600) + 3;
  const boxes = rows.map(r => {
    const cx = xs(pnav(r)), cy = ys(r.yld);
    return {x1:cx - 7, x2:cx + 7, y1:cy - 7, y2:cy + 7};
  });
  /* The panel used to explain the quadrants in a sentence under the chart, and
     had them the wrong way round: cheap is a low multiple, so it is to the
     left, and paying is a high yield, so it is up. Saying it on the plot is
     both shorter and harder to get backwards. These go into the collision set
     before any ticker is placed, so a label never lands on one. */
  const terse = W < 430;
  const quads = [
    {t: terse ? "CHEAP" : "CHEAP · PAYING",       x:L + 2,     y:T + 10,     anchor:"start"},
    {t: terse ? "EXPENSIVE" : "EXPENSIVE · THIN", x:W - R - 2, y:T + ih - 5, anchor:"end"}
  ];
  /* measured with its letter-spacing, not guessed — the old estimate ran about
     10px short, which let a ticker be placed into a caption that was really
     there. The parity caption goes in too, and a quadrant caption that would
     land on it steps down a line. */
  const capBox = (q, dy = 0) => {
    const w = textWidth(q.t, 8.5, 400, 1.1) + 4, y = q.y + dy;
    return {x1: q.anchor === "end" ? q.x - w : q.x, x2: q.anchor === "end" ? q.x : q.x + w,
            y1: y - 9, y2: y + 3};
  };
  const navBox = {x1: xs(1) + 3, x2: xs(1) + 30, y1: T, y2: T + 12};
  boxes.push(navBox);
  quads.forEach(q => {
    let bx = capBox(q);
    for(const dy of [0, 13, 26]){
      bx = capBox(q, dy);
      if(!boxes.some(b => bx.x1 < b.x2 && bx.x2 > b.x1 && bx.y1 < b.y2 && bx.y2 > b.y1)){
        q.y += dy; break;
      }
    }
    boxes.push(bx);
  });
  const clash = a => boxes.some(b => a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1);

  /* densest first: the crowded middle gets the good positions, and the
     names out on their own are still easy to place with what is left */
  const order = rows.map((r, i) => i).sort((a, c) => {
    /* the selected name is the one label the plot must not lose */
    const selA = sel && rows[a].tk === sel.tk, selC = sel && rows[c].tk === sel.tk;
    if(selA !== selC) return selA ? -1 : 1;
    const near = i => rows.reduce((n, o) => {
      const dx = xs(pnav(o)) - xs(pnav(rows[i])), dy = ys(o.yld) - ys(rows[i].yld);
      return n + (dx * dx + dy * dy < 3600 ? 1 : 0);
    }, 0);
    return near(c) - near(a);
  });

  const pts = [];
  order.forEach(i => {
    const r = rows[i];
    const g = EQ_SEG[r.seg] || EQ_SEGS[0];
    const cx = xs(pnav(r)), cy = ys(r.yld);
    const on = sel && r.tk === sel.tk;
    const w = lw(r.tk);
    const cands = [
      {lx:cx + 8,  anchor:"start",  x1:cx + 8,      dy:3.4},
      {lx:cx - 8,  anchor:"end",    x1:cx - 8 - w,  dy:3.4},
      {lx:cx,      anchor:"middle", x1:cx - w / 2,  dy:-9},
      {lx:cx,      anchor:"middle", x1:cx - w / 2,  dy:15}
    ];
    let best = null;
    outer:
    for(const nudge of [0, -LH, LH, -2 * LH, 2 * LH, -3 * LH, 3 * LH]){
      for(const c of cands){
        const y = cy + c.dy + nudge;
        const bx = {x1:c.x1, x2:c.x1 + w, y1:y - 8.5, y2:y + 3};
        if(bx.x1 < 2 || bx.x2 > W - 2 || bx.y1 < T - 8 || bx.y2 > T + ih + 8) continue;
        if(clash(bx)) continue;
        best = {...c, y, bx};
        break outer;
      }
    }
    if(!best){ pts.push({r, g, cx, cy, on, hide:true}); return; }
    boxes.push(best.bx);
    pts.push({r, g, cx, cy, lx:best.lx, ly:best.y, anchor:best.anchor, on});
  });

  const named = pts.filter(p => !p.hide).length;
  const marks = pts.map(p => {
    const fill = C.cats[EQ_SEGS.findIndex(g => g.k === p.r.seg)] || C.line;
    /* only the dimming is written down. With nothing selected there is no
       opacity attribute at all, which is what "all 23 at full strength" should
       look like in the DOM as well as on screen. */
    return `<g class="scatpt" data-act="seleq" data-v="${esc(p.r.tk)}"${!p.on && sel ? ` opacity="0.55"` : ""}>
      <title>${esc(p.r.tk)} · ${esc(p.r.co)} — ${pnav(p.r).toFixed(2)}× NAV, ${p.r.yld.toFixed(1)}% yield</title>
      ${p.on ? `<circle cx="${p.cx.toFixed(1)}" cy="${p.cy.toFixed(1)}" r="11"
                        fill="none" stroke="${fill}" stroke-width="1.6" opacity=".55"/>` : ""}
      ${eqMark(p.g.mk, p.cx, p.cy, 5.6, fill)}
      ${p.hide ? "" : `<text x="${p.lx.toFixed(1)}" y="${p.ly.toFixed(1)}" text-anchor="${p.anchor}" font-size="9.5"
            font-weight="${p.on ? 700 : 600}" fill="${p.on ? C.label : C.axis}">${esc(p.r.tk)}</text>`}
      <circle cx="${p.cx.toFixed(1)}" cy="${p.cy.toFixed(1)}" r="9" fill="transparent"/>
    </g>`;
  }).join("");

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Price to net asset value against dividend yield, ${rows.length} names, marked and shaped by segment${
        named === rows.length ? ", each labelled with its ticker"
                              : `, ${named} of them labelled; the rest carry their ticker on the mark`}">
      ${grid}
      <line x1="${xs(1).toFixed(1)}" y1="${T}" x2="${xs(1).toFixed(1)}" y2="${T + ih}"
            stroke="${C.axis}" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="${(xs(1) + 5).toFixed(1)}" y="${T + 9}" font-size="9.5" letter-spacing="1"
            fill="${C.axis}">NAV</text>
      ${marks}
      ${quads.map(q => `<text x="${q.x.toFixed(1)}" y="${q.y.toFixed(1)}" text-anchor="${q.anchor}"
            font-size="8.5" letter-spacing="1.1" fill="${C.axis}">${q.t}</text>`).join("")}
      <text x="${L}" y="${H - 6}" font-size="9.5" letter-spacing=".8" fill="${C.axis}">PRICE / NAV →</text>
      <text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="9.5" letter-spacing=".8"
            fill="${C.axis}">↑ DIVIDEND YIELD %</text>
    </svg>`;
}

/* the legend carries shape, hue and name together, which is what makes the
   plot readable without relying on hue alone */
const eqLegend = () => `<div class="eqleg">${EQ_SEGS.map((g, i) => `
  <span class="eqleg-i"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
    ${eqMark(g.mk, 7, 7, 5, `var(${g.v})`)}</svg>${esc(g.short)}</span>`).join("")}</div>`;

/* Two lines on one scale have to say which is which. The swatch is a line
   segment rather than a dot because a line is what it stands for, and the
   name is spelled out beside it — the overlay hue is never carrying the
   identification on its own. */
const basketLegend = (e, ovColor) => `<div class="eqleg">
  <span class="eqleg-i"><i class="lgl" style="background:${BASKET.at(-1).v >= REBASE ? C.pos : C.neg}"></i>Coverage basket</span>
  ${e ? `<span class="eqleg-i"><i class="lgl" style="background:${ovColor}"></i>${esc(e.tk)} rebased</span>` : ""}
</div>`;

/* price chart – dashed 50c parity line, tinted regions above and
   below it, and a hover crosshair driven by its own data-pts */
const PC = {W:460, H:190, L:32, R:46, T:20, B:32};
function priceChart(m, w){
  const {H, L, R, T, B} = PC;
  const W = Math.max(260, Math.round(w || PC.W));
  const iw = W - L - R, ih = H - T - B, id = gradId();
  const rows = win(m.hist, 24);
  const xs = i => L + (rows.length < 2 ? iw / 2 : (i / (rows.length - 1)) * iw);
  const ys = v => T + ih - (v / 100) * ih;
  const y50 = ys(50);
  const col = m.state === "resolved" ? (m.outcome === "yes" ? C.pos : C.neg) : C.line;
  const pts = rows.map((r, j) => ({x:+xs(j).toFixed(1), y:+ys(r.p).toFixed(1), p:r.p, t:r.t}));
  const line = pts.map((p, i) => `${i ? "L" : "M"}${p.x} ${p.y}`).join(" ");
  const x0 = pts[0].x, xN = pts.at(-1).x, bw = Math.max(1, xN - x0);
  const area = `${line} L${xN} ${(T + ih).toFixed(1)} L${x0} ${(T + ih).toFixed(1)} Z`;

  const gridLines = [0, 50, 100].map(v =>
    `<text x="${L - 9}" y="${(ys(v) + 3.5).toFixed(1)}" text-anchor="end" font-size="9.5"
           font-family="${MONO_SVG}" fill="${C.axis}">${v}</text>`).join("");

  const marks = rows.length <= 13
    ? pts.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3.2" fill="${C.marker}" stroke="${col}" stroke-width="1.8"/>`).join("")
    : `<circle cx="${xN}" cy="${pts.at(-1).y}" r="3.6" fill="${C.marker}" stroke="${col}" stroke-width="2"/>`;

  const last = pts.at(-1);
  /* the readout is phrased where the chart is, not in the handler — that is
     what lets three charts of different shapes share one crosshair */
  return `<svg class="chart" id="pricechart" viewBox="0 0 ${W} ${H}" role="img"
       aria-label="YES price history in cents, ${rows[0].t} to ${rows.at(-1).t}"
       data-pts='${attrJSON(pts.map(p => ({x:p.x, y:p.y, t:`${p.t} · ${p.p}c`})))}'>
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${col}" stop-opacity=".22"/>
        <stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <rect x="${x0}" y="${T}" width="${bw.toFixed(1)}" height="${(y50 - T).toFixed(1)}"
            fill="${C.pos}" opacity=".05"/>
      <rect x="${x0}" y="${y50.toFixed(1)}" width="${bw.toFixed(1)}" height="${(T + ih - y50).toFixed(1)}"
            fill="${C.neg}" opacity=".04"/>
      <path d="${area}" fill="url(#${id})"/>
      <line x1="${L}" y1="${y50.toFixed(1)}" x2="${W - R + 6}" y2="${y50.toFixed(1)}"
            stroke="${C.rule}" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="${L}" y1="${T + ih}" x2="${W - R + 6}" y2="${T + ih}" stroke="${C.rule}" stroke-width="1"/>
      ${gridLines}
      <path d="${line}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"
            stroke-linecap="round"/>
      ${marks}
      <text x="${xN + 8}" y="${(last.y + 4).toFixed(1)}" font-size="12.5" font-weight="700"
            font-family="${MONO_SVG}" fill="${col}">${last.p}c</text>
      ${rows.length > 1 ? `
        <text x="${x0}" y="${H - 8}" text-anchor="start" font-size="9.5" font-family="${MONO_SVG}"
              fill="${C.axis}">${esc(rows[0].t)}</text>
        <text x="${xN}" y="${H - 8}" text-anchor="end" font-size="9.5" font-family="${MONO_SVG}"
              fill="${C.axis}">${esc(rows.at(-1).t)}</text>` : ""}
      ${crosshairLayer(T, ih, col)}
    </svg>`;
}

/* ═══════════════════════════════════════════════════════════════
   7. TICKET – one source of truth for the trade panel, so the
   rendered markup and the live (no re-render) updates agree.
   ═══════════════════════════════════════════════════════════════ */
function ticket(){
  const m = market(S.selId);
  if(!m || !tradable(m)) return null;
  const room = Math.max(0, MAXPOS - heldIn(m.id));
  const n = qtyNum();
  const cost = tradeCost(m, S.side, n);
  const afford = Math.min(maxAffordable(m, S.side, S.balance), room);
  const overCap = n > room, short = cost > S.balance;
  return {
    m, n, cost, room, afford, overCap, short,
    blocked: overCap || short,
    avg: Math.round((cost / n) * 100),
    payout: n,                       /* each share pays 1.00 credit */
    profit: n - cost,
    ret: cost > 0 ? ((n - cost) / cost) * 100 : 0,
    label: overCap ? "Over holding cap" : short ? "Short of credits" : `Buy ${S.side.toUpperCase()}`
  };
}

/* moves the segmented pill without a re-render, so it slides */
function syncSide(){
  const seg = document.getElementById("sideseg");
  if(seg) seg.dataset.sel = S.side;
  document.getElementById("side-yes")?.setAttribute("aria-pressed", String(S.side === "yes"));
  document.getElementById("side-no")?.setAttribute("aria-pressed", String(S.side === "no"));
}

/* keeps the ticket numbers live while the caret stays put */
function syncTicket(){
  const t = ticket();
  if(!t) return;
  const set = (id, txt) => { const el = document.getElementById(id); if(el) el.textContent = txt; };
  set("t-cost", `${cr(t.cost)} cr`);
  set("t-avg", `${t.avg}c`);
  set("t-payout", cr(t.payout));
  set("t-profit", sgn(t.profit));
  set("t-return", `${t.profit >= 0 ? "+" : ""}${t.ret.toFixed(0)}%`);
  const costEl = document.getElementById("t-cost");
  if(costEl) costEl.style.color = t.blocked ? "var(--neg)" : "var(--ink)";
  const btn = document.getElementById("buybtn");
  if(btn){ btn.disabled = t.blocked; btn.textContent = t.label; }
  const range = document.getElementById("qtyrange");
  if(range && document.activeElement !== range) range.value = String(t.n);
  const field = document.getElementById("qty");
  if(field && document.activeElement !== field) field.value = String(t.n);
}

/* ═══════════════════════════════════════════════════════════════
   8. ACTIONS
   ═══════════════════════════════════════════════════════════════ */
function pushHist(m){
  m.hist.push({t:"LIVE", p:yesC(m)});
  if(m.hist.length > 80) m.hist.shift();
}

function buy(){
  const t = ticket();
  if(!t) return;
  const {m, n, cost} = t;
  if(t.overCap){
    note(false, `Holding cap is ${MAXPOS} shares a market. You hold ${heldIn(m.id)}.`);
    render(); return;
  }
  if(t.short){
    note(false, `Short of credits for ${n} shares. Available ${cr(S.balance)} cr.`);
    render(); return;
  }
  /* the forecast used for scoring is the marginal price BEFORE the
     fill, share weighted. The average paid would overstate confidence. */
  const pre = pYes(m);
  const fSide = S.side === "yes" ? pre : 1 - pre;

  S.balance -= cost;
  const key = `${m.id}-${S.side}`;
  const held = position(key);
  if(held){ held.qty += n; held.cost += cost; held.fwd += fSide * n; }
  else S.positions.push({key, mId:m.id, q:m.q, side:S.side, qty:n, cost, fwd:fSide * n});

  m.vol += Math.round(cost);
  applyTrade(m, S.side, n);
  pushHist(m);
  logIt("buy", `Bought ${n} ${S.side.toUpperCase()} at ${t.avg}c on ${pad3(m.id)} for ${cr(cost)} cr.`,
        S.why.trim());
  note(true, `Filled ${n} ${S.side.toUpperCase()} at ${t.avg}c · ${cr(cost)} cr.`);
  S.why = "";
  render();
}

function closePos(key){
  const pos = position(key);
  if(!pos) return;
  const m = market(pos.mId);
  if(!m || !tradable(m)) return;

  const proceeds = -tradeCost(m, pos.side, -pos.qty);
  const avg = Math.round((proceeds / pos.qty) * 100);
  const pnl = proceeds - pos.cost;
  /* full precision throughout – cr() formats to 2 dp, so rounding the
     running totals only introduced drift */
  S.balance += proceeds;
  S.realised += pnl;
  m.vol += Math.round(proceeds);
  applyTrade(m, pos.side, -pos.qty);
  pushHist(m);
  S.positions = S.positions.filter(x => x.key !== key);
  logIt("sell", `Closed ${pos.qty} ${pos.side.toUpperCase()} at ${avg}c on ${pad3(m.id)} · realised ${sgn(pnl)} cr.`);
  note(true, `Closed ${pos.qty} ${pos.side.toUpperCase()} at ${avg}c · realised ${sgn(pnl)} cr.`);
  render();
}

function resolveMarket(id, outcome){
  const m = market(id);
  if(!m || m.state !== "open") return;
  m.state = "resolved";
  m.outcome = outcome;
  m.hist.push({t:"STL", p: outcome === "yes" ? 100 : 0});

  let paid = 0, settled = 0;
  S.positions = S.positions.filter(p => {
    if(p.mId !== id) return true;
    const won = p.side === outcome;
    const payout = won ? p.qty : 0;
    /* Brier: share-weighted marginal price at the time of each fill */
    const f = clamp(p.fwd / p.qty, 0, 1);
    S.brierSum += (f - (won ? 1 : 0)) ** 2;
    S.brierN += 1;
    S.balance += payout;
    S.realised += payout - p.cost;
    paid += payout; settled++;
    return false;
  });
  S.showResolve = false;
  logIt("settle", `Market ${pad3(id)} settled ${outcome.toUpperCase()} on ${m.source}. `
    + `Resolver ${m.resolver}. ${settled} position(s) paid ${cr(paid)} cr.`);
  note(true, `Settled ${outcome.toUpperCase()} · ${settled} position(s) paid ${cr(paid)} cr.`);
  render();
}

function createMarket(){
  const q = S.newQ.trim();
  if(!q){ note(false, "Give the market a question first."); render(); return; }
  const id = Math.max(0, ...S.markets.map(m => m.id)) + 1;
  const m = {
    id, q, cat:S.newCat, closes:"31/12/2026", resolver:"C. Hernandez",
    source:"To be set by the resolver before first settlement",
    p0:0.5, vol:0, state:"open", outcome:null, hist:[{t:"OPEN", p:50}]
  };
  seedPrice(m, 0.5);
  S.markets.push(m);
  S.newQ = ""; S.selId = id; S.mktFilter = "open"; S.mktCat = "all"; S.query = "";
  S.showResolve = false;
  logIt("open", `Market ${pad3(id)} opened at 50c in ${m.cat}.`);
  note(true, `Market ${pad3(id)} opened at 50c. Set a resolution source before it settles.`);
  render();
}

function sendMsg(){
  const c = convo(S.selConvo);
  const t = S.draft.trim();
  if(!c || !t) return;
  c.msgs.push({f:"me", t, at:"Now"});
  S.draft = "";
  render();
  const th = document.getElementById("thread");
  if(th) th.scrollTop = th.scrollHeight;   /* after render's scroll restore */
}

function addReport(){
  S.reports.unshift({id:Date.now(), name:`Ad-hoc note – ${BUILD}`, owner:"C. Hernandez",
    desk:"Research", cadence:"Ad hoc", status:"Queued", updated:"Just now"});
  note(true, "Queued for the next distribution run.");
  render();
}

/* ═══════════════════════════════════════════════════════════════
   9. VIEW PARTS
   ═══════════════════════════════════════════════════════════════ */
const NAV = [
  {id:"predict", idx:"01", lab:"Predictions", sub:"CALIBRATION"},
  {id:"comms",   idx:"02", lab:"Comms",       sub:"WA · SLACK · ICE"},
  {id:"reports", idx:"03", lab:"Reports",     sub:"RESEARCH LIBRARY"}
];

const head = (kick, kickR, h1, em, deck) => `
  <div class="kicker-row"><span class="kicker">${kick}</span><span class="kicker r">${kickR}</span></div>
  <h1 class="hl">${h1} <em>${em}</em></h1>

  <div class="hairfade"></div>`;

const blank = (h5, p) => `<div class="blank"><h5>${h5}</h5><p>${p}</p></div>`;

const statTile = ({label, value, unit, sub, cls = "", tone = "", meter, accent}) => `
  <div class="stat ${cls}"${accent ? ` style="--accent:var(${accent})"` : ""}>
    <span class="l">${label}</span>
    <div class="k ${tone}">${value}${unit ? `<span class="u">${unit}</span>` : ""}</div>
    ${sub ? `<div class="sub">${sub}</div>` : ""}
    ${meter != null ? `<div class="meter"><i style="width:${clamp(meter, 0, 100).toFixed(0)}%"></i></div>` : ""}
  </div>`;

function statusChip(s){
  const cls = {"Published":"pos", "In review":"warn", "Draft":"mute", "Queued":"tealc"}[s] || "mute";
  return `<span class="chip ${cls}">${esc(s)}</span>`;

const outcomeChip = m =>

/* ── ticker · built once, then updated in place so the marquee
      keeps running across re-renders ──────────────────────────── */
function tickerItems(){
  const items = S.markets.filter(tradable).map(m => {
    const prev = m.hist.length > 1 ? m.hist.at(-2).p : yesC(m);
    return {
      key:`m${m.id}`, ...(CAT_TICK[m.cat] || {tag:"MKT", color:"#7FD0E5"}),
      text:`${m.q.length > 44 ? `${m.q.slice(0, 44)}…` : m.q}   YES ${yesC(m)}c`,
      delta:yesC(m) - prev
    };
  });
  const unread = S.convos.reduce((a, c) => a + c.unread, 0);
  items.push({key:"comms", tag:"COMMS", color:"#A9C9D6",
    text:`${unread} unread · WhatsApp / Slack / ICE Chat`, delta:0});
  const pub = S.reports.filter(r => r.status === "Published").length;
  items.push({key:"rsrch", tag:"RSRCH", color:"#FFB74D",
    text:`${pub} published · next distribution Monday 08:00`, delta:0});
  const b = BASKET.at(-1).v, bPrev = BASKET.at(-2).v;
  items.push({key:"equit", tag:"EQTY", color:"#9FD9C6",
    text:`Shipping basket ${b.toFixed(1)} · tankers lead, boxes lag`,
    delta:Math.round(b - bPrev)});
  return items;
}

function tickerShell(){
  return `<div class="ticker">
    <span class="sr-only">Rolling summary of market prices, unread messages and published reports.</span>
    <div class="tick-cap" aria-hidden="true"><span class="dot"></span>AFFINITY OPS DECK</div>
    <div class="tick-track" id="ticktrack" aria-hidden="true"></div></div>`;
}

let tickSig = "";
function syncTicker(){
  const items = tickerItems();
  const sig = items.map(i => i.key).join("|");
  const track = document.getElementById("ticktrack");
  if(!track) return;
  if(sig !== tickSig){
    tickSig = sig;
    const row = items.map(i => `<span class="tick-item" data-tk="${i.key}">
        <span class="tick-tag" style="background:${i.color}">${i.tag}</span>
        <span class="tk-text"></span><span class="tk-d"></span>
        <span class="tick-sep">◆</span></span>`).join("");
    track.innerHTML = `<span class="tick-lead"></span>${row}<span class="tick-lead"></span>${row}`;
  }
  items.forEach(i => {
    document.querySelectorAll(`[data-tk="${i.key}"]`).forEach(el => {
      el.querySelector(".tk-text").textContent = i.text;
      const d = el.querySelector(".tk-d");
      d.textContent = i.delta ? `${i.delta > 0 ? "▲" : "▼"}${Math.abs(i.delta)}` : "";
      d.className = `tk-d ${i.delta > 0 ? "tick-up" : i.delta < 0 ? "tick-down" : ""}`;
    });
  });
}

/* forward curve. The shape is the point, so each contract gets a
   sparkline of its own three quarters next to the near price. */
function ffaView(){
  const rows = FFA.map(f => {
    const near = f.v[0], far = f.v.at(-1);
    const down = far < near;
    return `<div class="ffa">
      <div class="ffa-top">
        <span class="rate-n">${esc(f.k)}</span>
        <span class="ffa-shape ${down ? "dn" : "up"}">${down ? "BACKWARDATED" : "CONTANGO"}</span>
      </div>
      <div class="ffa-q">${f.q.map((q, i) => `<span><i>${esc(q)}</i>${cr0(f.v[i])}</span>`).join("")}</div>
    </div>`;
  }).join("");
  return `<div class="rates-h"><span>FFA CURVE</span><span>$/DAY</span></div>${rows}`;

function bunkerView(){
  const rows = BUNKERS.map(b => {
    const up = b.d >= 0;
    return `<div class="rate bunker ${up ? "up" : "dn"}">

function portfolio(){
  const value = S.positions.reduce((a, p) => {
    const m = market(p.mId);
    return m ? a + p.qty * sideC(m, p.side) / 100 : a;
  }, 0);
  const cost = S.positions.reduce((a, p) => a + p.cost, 0);
  const brier = S.brierN ? S.brierSum / S.brierN : null;
  return {value, cost, unreal:value - cost, brier, equity:S.balance + value};
}

function statsStrip(){
  const p = portfolio();
  return `<div class="stats">
    ${statTile({label:"Credits available", value:cr0(S.balance), unit:"cr", cls:"lead",
      sub:`Equity ${cr0(p.equity)} cr against a 1,000 allocation`,
      meter:(S.balance / 1000) * 100})}
    ${statTile({label:"Open exposure", value:cr0(p.value), unit:"cr", accent:"--c-tank",
      sub:`${S.positions.length} position${S.positions.length === 1 ? "" : "s"} at the current mark`})}
    ${statTile({label:"Unrealised", value:sgn(p.unreal), tone:pnlClass(p.unreal), accent:"--c-port",
      sub:p.cost ? `Paid ${cr(p.cost)} cr for the book` : "Nothing at risk yet"})}
    ${statTile({label:"Realised", value:sgn(S.realised), tone:pnlClass(S.realised), accent:"--c-new",
      sub:S.brierN ? `${S.brierN} position${S.brierN === 1 ? "" : "s"} settled` : "Nothing settled yet"})}
    ${statTile({label:"Brier score", accent:"--c-dry", value:p.brier === null ? "–" : p.brier.toFixed(3),
      sub:p.brier === null ? `Field average ${FIELD_BRIER.toFixed(3)}`
        : `${p.brier <= FIELD_BRIER ? "Ahead of" : "Behind"} the field at ${FIELD_BRIER.toFixed(3)}`,
      meter:p.brier === null ? 0 : (1 - clamp(p.brier / 0.35, 0, 1)) * 100})}
  </div>`;
}

function marketRow(m){
  const w = win(m.hist.map(x => x.p), 24);
  const delta = w.at(-1) - w[0];
  const mine = S.positions.filter(p => p.mId === m.id).map(p => p.side.toUpperCase()).join(" / ");
  const isRes = m.state === "resolved", yes = yesC(m);
  const tip = `${m.hist[0].t} ${m.hist[0].p}c to ${m.hist.at(-1).t} ${m.hist.at(-1).p}c`;

  const price = isRes ? outcomeChip(m) : `
    <div class="prob">
      <div class="prob-top">
        <span class="prob-val" data-mid="${m.id}">${yes}c</span>
        <span class="prob-no">NO ${noC(m)}c</span>
      </div>
      <div class="prob-bar ${yes < 50 ? "low" : ""}"><i style="width:${yes}%"></i></div>
    </div>`;

  return `<tr class="mrow${isRes || expired(m) ? " closed" : ""}" data-act="selmkt" data-v="${m.id}"
      tabindex="0" aria-current="${S.selId === m.id}" style="${catStyle(m.cat)}">
    <td class="mid">${pad3(m.id)}</td>
    <td>
      <div class="qtext">${esc(m.q)}</div>
      <div class="qmeta">
        <span class="cat">${esc(m.cat)}</span>
        <span class="due ${dueClass(m)}">${closeLabel(m)}</span>
        ${mine ? `<span class="hold">holding ${mine}</span>` : ""}
      </div>
    </td>
    <td>${price}</td>
    <td><div class="trend">${spark(w, delta >= 0 ? C.pos : C.neg, tip)}
      <span class="tdelta ${pnlClass(delta)}">${delta >= 0 ? "+" : "-"}${Math.abs(delta)}</span></div></td>
    <td class="mono num">${cr0(m.vol)}</td>
  </tr>`;
}

function ticketPanel(){
  const sel = market(S.selId);
  if(!sel) return `<div class="panel sticky">${blank("No market selected",
    "Pick a question from the table to see its price history and trade it.")}</div>`;

  const rows = win(sel.hist, 24);
  let body;

    body = tradeBox(sel) + govBox(sel);
  } else if(expired(sel)){
    body = `<div class="tradebox">
        <span class="chip warn" style="align-self:flex-start">Past close · awaiting settlement</span>
        <div class="fine">Trading stopped at the closing date. ${esc(sel.resolver)} settles this against

  } else {
    body = `<div class="tradebox">

      <div class="fine">Settled against ${esc(sel.source)}. Holders of ${sel.outcome.toUpperCase()} were

function calibrationPanel(brier){
  const board = [...BOARD, {who:"You", desk:"Research", n:S.brierN, pnl:S.realised, brier, me:true}]
    .sort((a, b) => (a.brier ?? 9) - (b.brier ?? 9));
  const best = board.find(r => r.brier != null)?.brier ?? 1;
  return `<div class="panel cqpanel">
    <div class="panel-h"><h3>Calibration table</h3>
      <span class="note">Ranked by Brier · lower is better</span></div>
    <div class="scroll" id="boardscroll"><table>
      <thead><tr><th>#</th><th>Name</th><th>Desk</th><th class="num">Settled</th>
        <th class="num">P&amp;L</th><th class="num">Brier</th></tr></thead>
      <tbody>${board.map((r, i) => `
        <tr${r.me ? ' class="me-row"' : ""}>
          <td><span class="rank${i < 3 && r.brier != null ? " top" : ""}">${i + 1}</span></td>
          <td style="font-weight:600;color:var(--ink)">${esc(r.who)}</td>
          <td style="color:var(--small);font-size:12px">${esc(r.desk)}</td>
          <td class="mono num">${r.n}</td>

          <td class="num"><div class="bscore">
            <div class="bbar${r.brier === best ? " best" : ""}">
              <i style="width:${r.brier == null ? 0 : ((1 - clamp(r.brier / 0.35, 0, 1)) * 100).toFixed(0)}%"></i>
            </div>
            <span class="mono" style="font-weight:700;color:var(--ink)">
              ${r.brier == null ? "–" : r.brier.toFixed(3)}</span>
          </div></td>
        </tr>`).join("")}</tbody></table></div>
    <div class="panel-f">Brier score is the mean squared error of your stated probabilities. It rewards being
      right on the calls you were confident about, and punishes confident misses harder than hedged ones.
      P&amp;L alone does not.</div>
  </div>`;
}

/* One description of the columns. The header, the sort control, the aria-sort

   drift apart the way a second hand-typed list would. `n` is the nth-child the
   container queries key on; `dir` is which way that column's sort actually
   runs, which is not the same for all of them — cheapest P/NAV is ascending. */
const EQ_COLS = [
  {n:1, key:"tk",   lab:"Instrument", num:false, dir:"ascending"},
  {n:2, key:null,   lab:"Company",    num:false},
  {n:3, key:null,   lab:"Last",       num:true},
  {n:4, key:"d1",   lab:"1D",         num:true,  dir:"descending"},
  {n:5, key:"ytd",  lab:"YTD",        num:true,  dir:"descending"},
  {n:6, key:"mcap", lab:"Cap $bn",    num:true,  dir:"descending"},
  {n:7, key:"pnav", lab:"P/NAV",      num:true,  dir:"ascending"},
  {n:8, key:"yld",  lab:"Yield",      num:true,  dir:"descending"},
  {n:9, key:null,   lab:"8 weeks",    num:false}
];
const EQ_COL = Object.fromEntries(EQ_COLS.filter(c => c.key).map(c => [c.key, c]));

const EQ_SORT_LABEL = {
  ytd:"best year to date", d1:"biggest move today", mcap:"largest market cap",
  pnav:"cheapest on P/NAV", yld:"highest yield", tk:"ticker A\u2013Z"
};
const EQ_SORTS = {
  ytd:  (a, b) => b.ytd - a.ytd,
  d1:   (a, b) => b.d1 - a.d1,
  mcap: (a, b) => b.mcap - a.mcap,
  pnav: (a, b) => pnav(a) - pnav(b),
  yld:  (a, b) => b.yld - a.yld,
  tk:   (a, b) => a.tk.localeCompare(b.tk)
};

/* Parity sits at the centre of the track on a log scale, so 0.5x and 2x are
   the same distance from it — a ratio does not read on a linear axis, which is
   why the scatter's x is log too. The window is 0.32x to 3.16x, which holds
   every name in the basket with room either side. */
function parityBar(pv){
  const p = clamp((Math.log10(pv) + 0.5) / 1, 0, 1) * 100;
  return p >= 50 ? `left:50%;width:${(p - 50).toFixed(1)}%`
                 : `left:${p.toFixed(1)}%;width:${(50 - p).toFixed(1)}%`;
}
const SORT_FOLD = {
  ytd:  e => pctTxt(e.ytd),
  mcap: e => `$${e.mcap.toFixed(2)}bn`,
  pnav: e => `${pnav(e).toFixed(2)}×`,
  yld:  e => `${e.yld.toFixed(1)}%`
};

function eqRow(e, sel, i){
  const seg = EQ_SEG[e.seg] || {lab:"—"};
  /* the sparkline reads the eight-week direction, not the last tick */
  const up = e.h.at(-1) >= e.h[0];
  const on = sel && sel.tk === e.tk;
  const pv = pnav(e);
  /* the figure the rows are ordered by, carried into the first cell for the
     widths where its own column has been shed. Empty for the two sorts whose
     column never goes (1D) or is the first cell already (ticker). */
  const sf = SORT_FOLD[S.eqSort] ? {lab:EQ_COL[S.eqSort].lab, txt:SORT_FOLD[S.eqSort](e)} : null;
  /* the id is what lets render()'s focus restore put the caret back on this
     row after a selection rewrites the column — the same mechanism the search
     field and the ticket inputs already ride on */
  /* One tab stop for the whole table rather than 23. The row that holds it is
     the selected one, or the first when nothing is selected; the arrow keys
     move it from there. Tab now reaches the basket and leaves it, which is
     what a list of 23 rows inside a page of controls needs. */
  const rove = on || (!sel && i === 0);
  return `<tr class="eqrow" id="eqrow-${esc(e.tk)}" style="${segStyle(e.seg)}" tabindex="${rove ? 0 : -1}" role="button"
      data-act="seleq" data-v="${esc(e.tk)}" aria-current="${on}"

    <td><span class="tkr">${esc(e.tk)}</span>

      <div class="eqmeta"><span class="exch">${esc(e.ex)}</span>
        <span class="cat" style="${segStyle(e.seg)}">${esc(seg.lab)}</span>

    <td><div class="coname">${esc(e.co)}</div></td>

  </tr>`;

/* The figures in the copy are pulled from the same rows the charts read,
   so a rewritten paragraph cannot quietly disagree with the bar above it. */
/* The three written notes, each tagged with the segment it is about. They used
   to be printed unconditionally, so filtering the basket to car carriers left
   the panel discussing Hormuz, boxes and dry bulk — three paragraphs about
   nothing on screen. Their figures still come out of the array; only which of
   them appear is new. */
const DESK_NOTES = [
  {segs:["tank"], h:"Hormuz still sets the tape", p: () =>
    `The March closure remains the single biggest input into the basket. Crude and product owners
     have carried it since, and the move is priced as a longer voyage rather than a higher rate —
     which is why tanker NAVs have run ahead of the freight curve rather than with it.`},
  {segs:["box"], h:"The boxes are the laggard, and that is the trade", p: () =>
    `Containers are up ${segYTD("box").toFixed(1)}% year to date, but the dispersion inside the
     segment is wider than the segment itself. Maersk has raised 2026 guidance twice and still
     trades at ${pnav(EQUITIES.find(e => e.tk === "MAERSK-B")).toFixed(2)}× NAV; Hapag-Lloyd carries
     a Middle East cost charge and a premium multiple.`},
  {segs:["dry"], h:"Dry bulk, quietly", p: () =>
    `Up ${segYTD("dry").toFixed(1)}% with far less noise than the tankers. The Cape-weighted owners
     are the cleanest listed expression of the Q4 5TC question sitting on the prediction desk, so
     the two are worth reading against each other.`}
];

/* A segment the desk has not written about still has a view, and it is in the
   array: the cap-weighted return, the spread inside it, how much of it trades
   above NAV, and the crossing to the prediction desk where one exists. Written
   the same way as everything else on this tab — computed, so it cannot come to
   disagree with the table under it. */
function segNote(g){
  const rows = segRows(g.k);
  if(!rows.length) return "";
  const byY = [...rows].sort((a, b) => b.ytd - a.ytd);
  const top = byY[0], bot = byY.at(-1);
  const above = rows.filter(e => pnav(e) > 1).length;
  const med = median(rows.map(pnav));
  const yld = rows.reduce((a, e) => a + e.yld, 0) / rows.length;
  const mk = EQ_LINK[g.k] ? market(EQ_LINK[g.k]) : null;
  const spread = rows.length > 1
    ? `the spread inside it runs ${pctTxt(bot.ytd)} to ${pctTxt(top.ytd)} —
       ${(top.ytd - bot.ytd).toFixed(1)} points between ${esc(bot.tk)} and ${esc(top.tk)}`
    : `${esc(top.tk)} is the whole of it, at ${pctTxt(top.ytd)}`;
  return `<div><h6>${esc(g.lab)} · ${rows.length} name${rows.length === 1 ? "" : "s"}</h6>
    <p>Cap-weighted the segment is ${pctTxt(segYTD(g.k))} year to date, and ${spread}.
      ${above} of ${rows.length} trade${above === 1 ? "s" : ""} above NAV at a median
      ${med.toFixed(2)}×, on an average
      yield of ${yld.toFixed(1)}%.${mk ? ` The prediction desk carries the same view as a
      question — ${esc(mk.q)} — currently ${yesC(mk)}c.` : ""}</p></div>`;
}

/* What the desk says about what is on screen. With the whole basket showing,
   that is the three written notes, as before. Filtered down to one or two
   segments, the segment is worked out from the array first and only the notes
   whose subject survives the filter follow it. */
function deskView(){
  const rows = eqShown();
  if(!rows.length) return `<div class="desknote"><div><h6>Nothing on screen</h6>
    <p>The filter has emptied the basket, so there is nothing for the desk to read against.
      Widen the segment or clear the search to bring the coverage list back.</p></div></div>`;
  const on = EQ_SEGS.filter(g => rows.some(e => e.seg === g.k));
  const written = DESK_NOTES.filter(n => on.some(g => n.segs.includes(g.k)));
  const computed = (on.length <= 2 || !written.length) ? on.slice(0, 3).map(segNote) : [];
  return `<div class="desknote">${computed.join("")}${written
    .map(n => `<div><h6>${n.h}</h6><p>${n.p()}</p></div>`).join("")}</div>`;
}

/* The rows currently on screen. The view and the export both read it, so an
   export can never quietly disagree with the table it was taken from. */
function eqShown(){
  const q = S.eqQuery.trim().toLowerCase();
  return EQUITIES
    .filter(e => S.eqSeg === "all" || e.seg === S.eqSeg)
    .filter(e => !q || e.tk.toLowerCase().includes(q) || e.co.toLowerCase().includes(q)
                    || e.ex.toLowerCase().includes(q))
    .sort(EQ_SORTS[S.eqSort] || EQ_SORTS.ytd);
}

/* every field behind the tab, in the listing currency it is quoted in */
function eqCSV(rows){
  const cell = v => {
    const t = String(v ?? "");
    return /[",\r\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
  };
  const head = ["Ticker","Company","Exchange","Currency","Segment","Last","1D %","YTD %",
    "Market cap US$bn","NAV per share","P/NAV","EV/EBITDA","Yield %","52w low","52w high",
    "Vessels","Capacity","Desk view", ...WK.map(w => `${w} close`), "Source"];
  /* the file leaves the building, so the qualification goes with it — a column
     rather than a trailing line, because a trailing line is not CSV */
  const body = rows.map(e => [e.tk, e.co, e.ex, e.ccy, (EQ_SEG[e.seg] || {}).lab || "",
    e.px, e.d1, e.ytd, e.mcap, e.nav, pnav(e).toFixed(4), e.ev, e.yld, e.lo, e.hi,
    e.fleet, e.cap, e.note, ...e.h, "Indicative placeholder, not a live feed"].map(cell).join(","));
  return [head.map(cell).join(","), ...body].join("\r\n");
}

/* ═══════════════════════════════════════════════════════════════
   13. SHELL AND RENDER
   The frame is mounted once. Only the body of the main column is
   rewritten on a state change, so the ticker keeps its animation
   and the main scroll position survives every interaction.
   ═══════════════════════════════════════════════════════════════ */
const app = document.getElementById("app");

function mountShell(){

      </nav>

const VIEWS = {predict:predictView, comms:commsView, reports:reportsView};
const SCROLLERS = ["log", "thread", "mktscroll", "eqscroll", "libscroll", "wirescroll"];

function render(){
  readPalette();                 /* charts follow the active theme */

  const active = document.activeElement;
  const fid = active && active.id ? active.id : null;
  let ss = null, se = null;
  if(fid && active.setSelectionRange){
    try{ ss = active.selectionStart; se = active.selectionEnd; }catch{}
  }
  const keep = {};
  SCROLLERS.forEach(id => {
    const n = document.getElementById(id);
    if(n) keep[id] = n.scrollTop;
  });

  document.getElementById("spinebrand").innerHTML = spineView();
  document.getElementById("nav").innerHTML = navView();
  /* the queue is rebuilt with the body, and painted the moment the body is in
     the document — before the scroll restore, so the heights have settled by
     the time a scrollTop is written back */
  chartSlots = []; chartSeq = 0;
  /* the crosshair lives inside a chart, and the charts are about to be
     replaced — drop the handle with them rather than hold a detached node */
  phOn = null;
  document.getElementById("mainbody").innerHTML = (VIEWS[S.tab] || predictView)();
  paintCharts();

  SCROLLERS.forEach(id => {
    const n = document.getElementById(id);
    if(n && keep[id] != null) n.scrollTop = keep[id];
  });
  if(fid){
    const back = document.getElementById(fid);
    if(back){
      back.focus();
      if(ss !== null && back.setSelectionRange){
        try{ back.setSelectionRange(ss, se); }catch{}
      }
    }
  }
  const th = document.getElementById("thread");
  if(th && keep.thread == null) th.scrollTop = th.scrollHeight;

  syncTicker();
  flashChanges();
  syncRoute();
}

/* pulse the YES price of any market whose mark moved since last paint */
function flashChanges(){
  S.markets.forEach(m => {
    const now = yesC(m);
    if(prevPrice[m.id] != null && prevPrice[m.id] !== now){
      document.querySelector(`.prob-val[data-mid="${m.id}"]`)?.classList.add("flash");
    }
    prevPrice[m.id] = now;
  });
}

/* ── price chart crosshair ───────────────────────────────────── */
/* One crosshair, three charts. A chart opts in by carrying data-pts and a
   .ph layer; the handler reads the frame it is actually drawn in, so nothing
   here knows a constant. Only one is ever lit, and the one that was lit is
   held rather than looked up again — this runs at pointer rate. */
let phOn = null;
function hideCrosshair(){
  if(phOn){ phOn.setAttribute("opacity", "0"); phOn = null; }
}
function moveCrosshair(e){
  const svg = e.target.closest ? e.target.closest("svg.chart[data-pts]") : null;
  if(!svg){ hideCrosshair(); return; }
  const g = svg.querySelector(".ph");
  if(!g){ hideCrosshair(); return; }
  if(phOn && phOn !== g) hideCrosshair();

  const pts = svg._pts || (svg._pts = JSON.parse(svg.dataset.pts));
  const box = svg.getBoundingClientRect();
  if(!box.width) return;
  /* the chart is sized from its slot now, so the mapping reads the frame it is
     actually drawn in rather than the constant it used to be drawn at */
  const VW = svg.viewBox.baseVal.width;
  const ux = (e.clientX - box.left) / box.width * VW;
  const near = pts.reduce((best, p) => Math.abs(p.x - ux) < Math.abs(best.x - ux) ? p : best, pts[0]);

  /* the plate used to be sized at 5.6px a character, which is the estimate the
     scatter was already caught out by. It is measured now, and it has to be:
     the readout carries a ticker and two figures on the basket, not four
     characters of cents. */
  const w = Math.max(40, textWidth(near.t, 9.5, 700) + 16);
  const cx = clamp(near.x, w / 2 + 2, VW - w / 2 - 2);

  const ln = g.querySelector(".ph-line");
  ln.setAttribute("x1", near.x);
  ln.setAttribute("x2", near.x);
  const dot = g.querySelector(".ph-dot");
  dot.setAttribute("cx", near.x);
  dot.setAttribute("cy", near.y);
  /* where the readout names two series, both get a dot — a plate that says
     FRO 111.3 with nothing marking it is asking to be read off the wrong line */
  const dot2 = g.querySelector(".ph-dot2");
  if(dot2 && near.oy != null){
    dot2.setAttribute("cx", near.x);
    dot2.setAttribute("cy", near.oy);
  }
  const rect = g.querySelector(".ph-box");
  rect.setAttribute("x", cx - w / 2);
  rect.setAttribute("width", w);
  const lab = g.querySelector(".ph-lab");
  lab.setAttribute("x", cx);
  lab.textContent = near.t;
  g.setAttribute("opacity", "1");
  phOn = g;
}

/* ═══════════════════════════════════════════════════════════════
   14. EVENTS – delegated, so a re-render never breaks a binding
   ═══════════════════════════════════════════════════════════════ */
app.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if(!t || t.disabled) return;
  const act = t.dataset.act, v = t.dataset.v;
  switch(act){
    case "theme":
      S.theme = S.theme === "dark" ? "light" : "dark";
      applyTheme();
      render();                  /* re-render so the charts repaint */
      break;
    case "tab":     S.tab = v; S.showResolve = false; render(); break;
    case "dismiss": S.note = null; render(); break;
    case "mfilter": S.mktFilter = v; render(); break;
    case "selmkt":  S.selId = Number(v); S.showResolve = false; render(); break;
    case "side":    S.side = v; syncSide(); syncTicket(); break;
    case "setqty": {
      const t2 = ticket();
      S.qty = v === "max" ? String(Math.max(1, t2 ? t2.afford : 1)) : v;
      render();
      break;
    }
    case "buy":           buy(); break;
    case "close":         closePos(v); break;
    case "newmkt":        createMarket(); break;
    case "resolvetoggle": S.showResolve = !S.showResolve; render(); break;
    case "settle":        resolveMarket(S.selId, v); break;
    case "cfilter":       S.convoFilter = v; render(); break;
    case "selconvo": {
      S.selConvo = Number(v);
      const c = convo(S.selConvo);
      if(c) c.unread = 0;
      render();
      const th = document.getElementById("thread");
      if(th) th.scrollTop = th.scrollHeight;
      break;
    }
    case "send":      sendMsg(); break;
    case "genreport": addReport(); break;
    case "export":    note(true, `Export queued for ${S.reports.length} reports.`); render(); break;
    case "rtab":      S.rtab = v; render(); break;
    /* folding the panel away hands its 336px back to the table, which is what
       returns the valuation columns on a laptop. The toggle carries an id, so
       render()'s focus restore leaves the caret on it. */
    case "eqpanel":   S.eqPanel = !S.eqPanel; render(); break;
    /* the header is the other way into the sort. It sets the same state the
       select does, so the two can never show different things. */
    case "eqsortcol": S.eqSort = v; render(); break;
    case "eqseg":     S.eqSeg = v; render(); break;
    case "eqclear":   S.eqSeg = "all"; S.eqQuery = ""; render(); break;
    case "seleq": {
      /* clicking the name that is already selected clears it, which is the
         other half of Escape — and the only way back to an undimmed scatter */
      S.eqSel = S.eqSel === v ? null : v;
      render();
      announceEq();
      /* render() puts focus back by id, which covers a click or Enter on the
         row itself. A peer button inside the panel does not survive the
         rewrite, so in that case the row it selected takes the focus. */
      if(document.activeElement === document.body)
        document.getElementById(`eqrow-${v}`)?.focus({preventScroll:true});
      revealEqDetail();
      break;
    }
    /* the crossing to the prediction desk – the market a segment's names are
       another expression of. Widen the market filters so it cannot land on a
       question the current view happens to be filtering out. */
    case "gotomkt":
      S.tab = "predict"; S.selId = Number(v); S.showResolve = false;
      S.mktFilter = "all"; S.mktCat = "all"; S.query = "";
      render();
      document.getElementById("nav-predict")?.focus();
      break;
    /* This raised a toast and did nothing. A button that does not do what it
       says is a trust cost on a portal, and the rows it would export are
       already in memory. It exports what is on screen, filters and sort
       included, which is what "export" means when a view is filtered. */
    case "eqexport": {
      const rows = eqShown();
      const url = URL.createObjectURL(new Blob([eqCSV(rows)], {type:"text/csv;charset=utf-8"}));
      const a = document.createElement("a");
      a.href = url;
      a.download = `affinity-shipping-basket-${BUILD.replace(/\//g, "-")}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      note(true, `Exported ${rows.length} name${rows.length === 1 ? "" : "s"} to CSV.`);
      render();
      break;
    }
    case "eqclearsel": S.eqSel = null; render(); announceEq(); break;
  }
});

/* Arrow keys walk the basket without selecting, so a reader can run down the
   names at speed and open the one they want with Enter. Moving the roving
   tabindex with the caret keeps the table a single tab stop. No render() here:
   this is focus only, which is why it stays instant. */
function eqArrow(e, row){
  const rows = [...document.querySelectorAll(".eqrow")];
  const i = rows.indexOf(row);
  if(i < 0) return false;
  let j = null;
  if(e.key === "ArrowDown")      j = Math.min(i + 1, rows.length - 1);
  else if(e.key === "ArrowUp")   j = Math.max(i - 1, 0);
  else if(e.key === "Home")      j = 0;
  else if(e.key === "End")       j = rows.length - 1;
  if(j === null) return false;
  e.preventDefault();
  rows[i].tabIndex = -1;
  rows[j].tabIndex = 0;
  rows[j].focus();
  return true;
}

app.addEventListener("keydown", e => {
  const inEq = S.tab === "reports" && S.rtab === "equities";
  const eqrow = e.target.closest ? e.target.closest(".eqrow") : null;
  if(eqrow && eqArrow(e, eqrow)) return;
  /* Escape backs out one step at a time: the search first, then the selection,
     which is what lets the scatter be seen with nothing held down. */
  if(e.key === "Escape" && inEq){
    if(e.target.id === "eqsearch" && S.eqQuery){ e.preventDefault(); S.eqQuery = ""; render(); return; }
    if(S.eqSel !== null){ e.preventDefault(); S.eqSel = null; render(); return; }
  }
  if(e.key !== "Enter" && e.key !== " ") return;
  const row = e.target.closest ? e.target.closest(".mrow") : null;
  if(row){
    e.preventDefault();
    S.selId = Number(row.dataset.v);
    S.showResolve = false;
    render();
    return;
  }
  const eqr = e.target.closest ? e.target.closest(".eqrow") : null;
  if(eqr){
    e.preventDefault();
    S.eqSel = S.eqSel === eqr.dataset.v ? null : eqr.dataset.v;
    render();
    announceEq();
    return;
  }
  if(e.key !== "Enter") return;
  if(e.target.id === "draft"){ e.preventDefault(); sendMsg(); }
  if(e.target.id === "newq"){ e.preventDefault(); createMarket(); }
  if(e.target.id === "why" || e.target.id === "qty"){ e.preventDefault(); buy(); }
});

/* silent binds – typing updates the ticket in place, so focus and
   caret survive. Only a field marked data-live forces a re-render. */
app.addEventListener("input", e => {
  const el = e.target;
  if(el.id === "qtyrange"){ S.qty = el.value; syncTicket(); return; }
  const b = el.dataset ? el.dataset.bind : null;
  if(!b) return;
  S[b] = el.value;
  if(b === "qty"){ syncTicket(); return; }
  if(el.dataset.live !== undefined) render();
});

app.addEventListener("change", e => {
  const b = e.target.dataset ? e.target.dataset.bind : null;
  if(!b) return;
  S[b] = e.target.value;
  /* size settles in place. A render() here would swap the Buy button out
     during the blur that the click on it caused, so the click landed on a
     detached node and the trade never fired – syncTicket already clamps
     the typed value and writes it back to the field. */
  if(b === "qty"){ S.qty = String(qtyNum()); syncTicket(); return; }
  if(b === "mktCat" || b === "sort" || b === "eqSeg" || b === "eqSort") render();
});

app.addEventListener("pointermove", moveCrosshair);
document.addEventListener("pointerleave", hideCrosshair);

/* Boot order matters. The store is the default and the hash is the
   instruction, so the store is read first and a route that parses overwrites
   what it covers — otherwise a link shared into a browser that already has a
   stored view would land somewhere else. */
applyTheme();
restoreView();
applyRoute(location.hash);
mountShell();
render();

/* replaceState never fires this, so it only ever carries a hash the reader
   typed or a link they followed inside the page — both of which mean go
   there. A hash that parses to nowhere is left alone rather than resetting
   the view under them. */
window.addEventListener("hashchange", () => {
  if(applyRoute(location.hash)){ render(); announceEq(); }
});
</script>
</body>
